# Weekly dependency update PRs. Each PR gets a Vercel preview to check before merging.
# Security fixes come separately, as soon as an advisory is published
# (enable "Dependabot security updates" in the repo's Settings → Code security).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      # Patch and minor bumps land together in one PR; each major version gets its own PR.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
