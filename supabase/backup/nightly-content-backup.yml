# Nightly content backup — belongs in the PRIVATE backup repo, not this one.
# Copy to .github/workflows/nightly-content-backup.yml in greenpulsewellness/gpw-content-backups.
# Setup steps: docs/supabase-migration-plan.md, Phase 2b.
#
# Each night: fetch scripts/backup-content.mjs from the public website repo, dump catalog + content
# from Supabase into data/, and commit only if something changed. A failed run emails the repo owner.

name: Nightly content backup

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch: # "Run workflow" button, for a manual backup

permissions:
  contents: write

concurrency:
  group: content-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this backup repo
        uses: actions/checkout@v4

      - name: Fetch the backup script from the website repo
        uses: actions/checkout@v4
        with:
          repository: greenpulsewellness/gpw-website
          path: site
          sparse-checkout: scripts/backup-content.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Back up catalog and content
        run: node site/scripts/backup-content.mjs --out data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No content changes since the last backup."
            exit 0
          fi
          git commit -m "Content backup $(date -u +%F)" -m "$(git diff --cached --stat)"
          git push
